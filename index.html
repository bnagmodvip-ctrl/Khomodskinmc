<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>C.BANGVMOD - KHO MOD SKIN VÀ ADDON</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:#0b0b0b;
    color:white;
    min-height:100vh;
}

/* HEADER */
header{
    background:linear-gradient(135deg,#111,#1b1b1b);
    padding:18px 12px;
    text-align:center;
    border-bottom:2px solid #ff2020;
}

header h1{
    color:#ff2424;
    font-size:25px;
    text-shadow:0 0 12px red;
}

header p{
    color:#aaa;
    margin-top:6px;
    font-size:13px;
}

/* KEY */
#keyScreen{
    position:fixed;
    inset:0;
    background:#080808;
    z-index:9999;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.keyBox{
    width:100%;
    max-width:380px;
    background:#151515;
    padding:25px;
    border-radius:18px;
    border:1px solid #ff2222;
    box-shadow:0 0 25px #ff000055;
    text-align:center;
}

.keyBox h2{
    color:#ff2929;
    margin-bottom:10px;
}

.keyBox p{
    color:#aaa;
    font-size:13px;
    margin-bottom:18px;
}

.keyBox input{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #444;
    background:#080808;
    color:white;
    outline:none;
    margin-bottom:12px;
}

.keyBox button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#e50000;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

/* NOTICE */
.notice{
    margin:15px 12px;
    background:#171717;
    border-left:4px solid red;
    padding:14px;
    border-radius:10px;
    color:#ddd;
    font-size:14px;
}

/* SEARCH */
.searchBox{
    padding:10px 12px;
}

.searchBox input{
    width:100%;
    padding:13px;
    border-radius:10px;
    border:1px solid #333;
    background:#151515;
    color:white;
    outline:none;
}

/* MOD GRID */
.modGrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    padding:12px;
}

.modCard{
    background:#151515;
    border:1px solid #292929;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 5px 20px #000;
}

.modCard img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    display:block;
}

.modInfo{
    padding:10px;
}

.modTitle{
    font-size:15px;
    font-weight:bold;
    color:#fff;
    margin-bottom:7px;
}

.modDesc{
    color:#999;
    font-size:12px;
    min-height:30px;
}

.downloadCount{
    color:#aaa;
    font-size:11px;
    margin:8px 0;
}

/* DOWNLOAD BUTTON */
.downloadBtn{
    width:100%;
    border:none;
    padding:11px 5px;
    border-radius:9px;
    background:linear-gradient(135deg,#ff1717,#a90000);
    color:white;
    font-weight:bold;
    cursor:pointer;
    font-size:12px;
}

.downloadBtn:active{
    transform:scale(.96);
}

.downloadBtn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* REVIEW */
.reviewSection{
    margin:15px 12px;
    padding:15px;
    background:#151515;
    border-radius:14px;
    border:1px solid #292929;
}

.reviewSection h2{
    color:#ff2424;
    font-size:19px;
    margin-bottom:12px;
}

.reviewForm input,
.reviewForm textarea{
    width:100%;
    margin-bottom:9px;
    padding:12px;
    background:#080808;
    color:white;
    border:1px solid #333;
    border-radius:9px;
    outline:none;
}

.reviewForm textarea{
    min-height:80px;
    resize:vertical;
}

.reviewForm button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:9px;
    background:#e60000;
    color:white;
    font-weight:bold;
}

.review{
    border-top:1px solid #292929;
    padding:12px 0;
    margin-top:12px;
}

.reviewName{
    color:#ff3030;
    font-weight:bold;
}

.reviewText{
    margin-top:5px;
    color:#ddd;
    font-size:14px;
    word-break:break-word;
}

/* POPUP */
.popup{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:calc(100% - 30px);
    max-width:380px;
    background:#171717;
    border:1px solid red;
    border-radius:15px;
    padding:20px;
    z-index:8000;
    box-shadow:0 0 30px #ff000055;
    display:none;
}

.popup h2{
    color:#ff2828;
    margin-bottom:10px;
}

.popup p{
    color:#ccc;
    line-height:1.5;
    font-size:14px;
}

.popup button{
    margin-top:15px;
    width:100%;
    padding:12px;
    border:none;
    border-radius:9px;
    background:red;
    color:white;
    font-weight:bold;
}

/* FOOTER */
footer{
    text-align:center;
    padding:25px 10px;
    color:#666;
    font-size:12px;
}

/* MOBILE */
@media(max-width:350px){
    .modGrid{
        gap:8px;
        padding:8px;
    }

    .modInfo{
        padding:8px;
    }

    .modTitle{
        font-size:13px;
    }
}
</style>
</head>

<body>

<!-- KEY SCREEN -->
<div id="keyScreen">
    <div class="keyBox">
        <h2>🔐 NHẬP KEY</h2>
        <p>Nhập KEY để truy cập C.BANGVMOD</p>

        <input
            type="text"
            id="keyInput"
            placeholder="Nhập KEY..."
            autocomplete="off"
        >

        <button onclick="checkKey()">VÀO KHO MOD</button>
    </div>
</div>

<!-- HEADER -->
<header>
    <h1>🔥 C.BANGVMOD</h1>
    <p>KHO MOD SKIN VÀ ADDON</p>
</header>

<!-- NOTICE -->
<div class="notice">
    ⚡ <b>CHÀO MỪNG BẠN ĐẾN VỚI C.BANGVMOD!</b><br>
    Kho MOD SKIN & ADDON dành cho Minecraft.
</div>

<!-- SEARCH -->
<div class="searchBox">
    <input
        type="text"
        id="searchInput"
        placeholder="🔎 Tìm MOD..."
    >
</div>

<!-- MOD -->
<div class="modGrid" id="modGrid"></div>

<!-- REVIEW -->
<section class="reviewSection">

    <h2>💬 ĐÁNH GIÁ</h2>

    <div class="reviewForm">

        <input
            type="text"
            id="reviewName"
            placeholder="Tên của bạn"
            maxlength="40"
        >

        <textarea
            id="reviewText"
            placeholder="Viết đánh giá..."
            maxlength="500"
        ></textarea>

        <button onclick="submitReview()">
            GỬI ĐÁNH GIÁ
        </button>

    </div>

    <div id="reviewList"></div>

</section>

<footer>
    © 2026 C.BANGVMOD - KHO MOD SKIN VÀ ADDON
</footer>

<!-- POPUP -->
<div class="popup" id="welcomePopup">

    <h2>🎉 XIN CHÀO!</h2>

    <p>
        Chào mừng bạn đến với C.BANGVMOD.
        Chúc bạn tải MOD vui vẻ!
    </p>

    <button onclick="closePopup()">
        ĐÃ HIỂU
    </button>

</div>


<!-- FIREBASE -->
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    onSnapshot,
    query,
    orderBy,
    serverTimestamp,
    doc,
    runTransaction
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {
    apiKey: "AIzaSyDUzhj9RblwABf_v-S9JZAkrVZKEsT-WOU",
    authDomain: "phune-31284.firebaseapp.com",
    projectId: "phune-31284",
    storageBucket: "phune-31284.firebasestorage.app",
    messagingSenderId: "395938850354",
    appId: "1:395938850354:web:3f99d9c17343604739be2b",
    measurementId: "G-BDDQJW8MEL"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* =========================
   KEY
========================= */

const KEY = "CHAOMUNGBANDENVOIWED";


window.checkKey = function(){

    const input =
        document.getElementById("keyInput").value.trim();

    if(input === KEY){

        document.getElementById("keyScreen").style.display = "none";

        setTimeout(() => {

            document.getElementById("welcomePopup").style.display = "block";

        },300);

        localStorage.setItem("cbangvmode_key","true");

    }else{

        alert("❌ KEY không đúng!");

    }
};


/* =========================
   AUTO LOGIN
========================= */

if(localStorage.getItem("cbangvmode_key") === "true"){

    document.getElementById("keyScreen").style.display = "none";

}


/* =========================
   POPUP
========================= */

window.closePopup = function(){

    document.getElementById("welcomePopup").style.display = "none";

};


/* =========================
   MOD DATA
========================= */

const items = [

    {
        title:"MOD SKIN #1",
        description:"MOD SKIN Minecraft",
        image:"https://i.ibb.co/xKjghVkT/file-00000000430c81fa98149a77fb72606c.png",
        file:"https://drive.google.com/uc?export=download&id=1ucvTRdK80pbbICro2gMtXv4ANU7uMHUN"
    },

    {
        title:"MOD SKIN #2",
        description:"MOD SKIN Minecraft",
        image:"https://i.ibb.co/32B2rZZ/file-0000000090f88208862dcd265f0892fb.png",
        file:"https://drive.google.com/uc?export=download&id=1x9mbuN-JoIlSsxXHzvxzWeNPqLkWADmp"
    },

    {
        title:"MOD SKIN #3",
        description:"MOD SKIN Minecraft",
        image:"https://i.ibb.co/LdDttSX6/file-0000000084b0820b922086d1e7181d68.png",
        file:"https://drive.google.com/uc?export=download&id=1L5H6VoZxJlRugd6HxNzSbpqD4i2Vl6Nc"
    },

    {
        title:"MOD SKIN #4",
        description:"MOD SKIN Minecraft",
        image:"LINK-HINH-4",
        file:"LINK-FILE-4"
    },

    {
        title:"MOD SKIN #5",
        description:"MOD SKIN Minecraft",
        image:"LINK-HINH-5",
        file:"LINK-FILE-5"
    }

];


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(str){

    return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================
   RENDER MOD
========================= */

function renderMods(list = items){

    const grid =
        document.getElementById("modGrid");

    grid.innerHTML = "";

    list.forEach((item,index)=>{

        const card = document.createElement("div");

        card.className = "modCard";

        card.innerHTML = `

            <img
                src="${item.image}"
                alt="${escapeHTML(item.title)}"
                onerror="this.src='https://via.placeholder.com/500/111111/ff0000?text=MOD'"
            >

            <div class="modInfo">

                <div class="modTitle">
                    ${escapeHTML(item.title)}
                </div>

                <div class="modDesc">
                    ${escapeHTML(item.description)}
                </div>

                <div
                    class="downloadCount"
                    id="count-${index}"
                >
                    ⬇ Đã tải: 0
                </div>

                <button
                    class="downloadBtn"
                    data-index="${index}"
                >
                    ⬇ TẢI MOD
                </button>

            </div>
        `;

        grid.appendChild(card);

    });


    document
        .querySelectorAll(".downloadBtn")
        .forEach(button=>{

            button.addEventListener("click",()=>{

                const index =
                    Number(button.dataset.index);

                downloadMod(index);

            });

        });

}


/* =========================
   DOWNLOAD MOD
========================= */

async function downloadMod(index){

    const item = items[index];

    if(!item || !item.file){

        alert("❌ MOD này chưa có file!");

        return;
    }

    if(
        item.file.includes("LINK-FILE")
    ){

        alert("❌ MOD này chưa được thêm file!");

        return;
    }


    const button =
        document.querySelector(
            `.downloadBtn[data-index="${index}"]`
        );


    const oldText = button.innerHTML;


    button.disabled = true;

    button.innerHTML = "⏳ ĐANG TẢI...";


    try{

        /*
         * Tăng lượt tải
         */
        increaseDownload(index);


        /*
         * Lấy file từ URL
         */
        const response =
            await fetch(item.file);


        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }


        /*
         * Chuyển thành Blob
         */
        const blob =
            await response.blob();


        /*
         * Tạo URL tạm
         */
        const blobURL =
            URL.createObjectURL(blob);


        /*
         * Tạo nút tải ẩn
         */
        const a =
            document.createElement("a");


        a.href = blobURL;

        a.download =
            "SKINMODBANGVIP.SKIN";

        a.style.display = "none";


        document.body.appendChild(a);


        /*
         * KÍCH HOẠT TẢI
         */
        a.click();


        /*
         * Xóa
         */
        a.remove();


        setTimeout(()=>{

            URL.revokeObjectURL(blobURL);

        },2000);


    }catch(error){

        console.error(
            "DOWNLOAD ERROR:",
            error
        );


        alert(
            "❌ Không thể tải trực tiếp file.\n\n" +
            "Google Drive có thể đang chặn CORS hoặc yêu cầu xác nhận tải.\n\n" +
            "Nếu muốn bấm 1 lần là tải 100%, hãy đưa file lên host hỗ trợ tải trực tiếp."
        );

    }


    button.disabled = false;

    button.innerHTML = oldText;

}


/* =========================
   FIRESTORE DOWNLOAD COUNT
========================= */

async function increaseDownload(index){

    try{

        const ref =
            doc(
                db,
                "downloads",
                "mod_" + (index + 1)
            );


        await runTransaction(
            db,
            async(transaction)=>{

                const snap =
                    await transaction.get(ref);


                if(!snap.exists()){

                    transaction.set(
                        ref,
                        {
                            count:1
                        }
                    );

                }else{

                    const current =
                        Number(
                            snap.data().count || 0
                        );


                    transaction.update(
                        ref,
                        {
                            count:
                                current + 1
                        }
                    );

                }

            }
        );

    }catch(error){

        console.error(
            "DOWNLOAD COUNT ERROR:",
            error
        );

    }

}


/* =========================
   LIVE DOWNLOAD COUNT
========================= */

for(let i = 1; i <= 5; i++){

    const index = i - 1;

    const ref =
        doc(
            db,
            "downloads",
            "mod_" + i
        );


    onSnapshot(
        ref,
        snap=>{

            let count = 0;


            if(snap.exists()){

                count =
                    Number(
                        snap.data().count || 0
                    );

            }


            const element =
                document.getElementById(
                    "count-" + index
                );


            if(element){

                element.innerHTML =
                    "⬇ Đã tải: " + count;

            }

        },
        error=>{

            console.error(
                "COUNT SNAPSHOT ERROR:",
                error
            );

        }
    );

}


/* =========================
   REVIEWS
========================= */

window.submitReview = async function(){

    const name =
        document
            .getElementById("reviewName")
            .value
            .trim();


    const text =
        document
            .getElementById("reviewText")
            .value
            .trim();


    if(!name){

        alert("❌ Vui lòng nhập tên!");

        return;
    }


    if(!text){

        alert("❌ Vui lòng nhập đánh giá!");

        return;
    }


    try{

        await addDoc(
            collection(db,"reviews"),
            {
                name:name,
                text:text,
                createdAt:serverTimestamp()
            }
        );


        document
            .getElementById("reviewName")
            .value = "";


        document
            .getElementById("reviewText")
            .value = "";


        alert("✅ Đã gửi đánh giá!");

    }catch(error){

        console.error(error);

        alert(
            "❌ Không thể gửi đánh giá!"
        );

    }

};


/* =========================
   LIVE REVIEWS
========================= */

const reviewsQuery =
    query(
        collection(db,"reviews"),
        orderBy("createdAt","desc")
    );


onSnapshot(
    reviewsQuery,
    snapshot=>{

        const list =
            document.getElementById(
                "reviewList"
            );


        list.innerHTML = "";


        snapshot.forEach(docSnap=>{

            const data =
                docSnap.data();


            const div =
                document.createElement("div");


            div.className = "review";


            div.innerHTML = `

                <div class="reviewName">
                    👤 ${escapeHTML(data.name || "Ẩn danh")}
                </div>

                <div class="reviewText">
                    ${escapeHTML(data.text || "")}
                </div>

            `;


            list.appendChild(div);

        });

    },
    error=>{

        console.error(
            "REVIEWS ERROR:",
            error
        );

    }
);


/* =========================
   SEARCH
========================= */

document
    .getElementById("searchInput")
    .addEventListener("input",function(){

        const keyword =
            this.value
                .toLowerCase()
                .trim();


        const filtered =
            items.filter(item=>

                item.title
                    .toLowerCase()
                    .includes(keyword)

                ||

                item.description
                    .toLowerCase()
                    .includes(keyword)

            );


        renderMods(filtered);

    });


/* =========================
   START
========================= */

renderMods();

</script>

</body>
</html>
